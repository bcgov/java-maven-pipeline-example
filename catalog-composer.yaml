apiVersion: composer.io.nrs.gov.bc.ca/v1
kind: NRComposer
spec:
  generators:
    - backstage
    - gh-maven-build
    - gh-tomcat-deploy-onprem
    - nr-repository-composer
    - gh-oci-deploy-onprem
    - gh-polaris-composer-agent
  answers:
    ociArtifacts: ""
    pomRoot: ./
    deploymentConfigPaths: playbooks
    deployType: tomcat
    unitTestsPath: ""
    postDeployTestsPath: ""
    artifactRepositoryType: GitHubPackages
    artifactRepositoryPath: https://maven.pkg.github.com/bcgov/java-maven-pipeline-example
    artifactSrc: repo
    toolsBuildSecrets: ARTIFACTORY_USERNAME,ARTIFACTORY_PASSWORD
    toolsLocalBuildSecrets: ARTIFACTORY_USERNAME,ARTIFACTORY_PASSWORD
    mavenBuildCommand: --batch-mode -Dmaven.test.skip=true -Pgithub clean package
    javaPattern: Tomcat
    javaVersion: "21"
    deployJasperReports: false
    tomcatContext: pub#java-maven-pipeline-example
    useAltAppDirName: false
    altAppDirName: ""
    addWebadeConfig: false
    addLog4j2Config: false
    addTomcatContext: false
    createDataTmpDir: false
    clientId: e985d455-b0ff-470b-8731-e004fcfac915
    publishArtifactSuffix: .
    publishBaseDirectory: dist
    customRunner: "group: Larger Runners - OpenShift Static-IP"
